server:
  port: 8180 # API 게이트웨이 서버의 포트

# JWT 서명 비밀키.
# 운영에서는 반드시 환경변수 JWT_SECRET을 주입해야 하며,
# Identity 서비스와 동일한 값을 사용해야 한다(현재는 HS256 대칭키 모델).
# 중기적으로는 Identity가 발급, Gateway는 JWKS로 공개키 검증하는 비대칭 모델 권장.
jwt:
  secret: ${JWT_SECRET:dev-only-please-override-with-env-variable-in-production}

management.endpoints.web.exposure.include: health, circuitbreakers

spring:
  data:
    redis:
      master:
        host: localhost
        port: 6379
      slave:
        host: localhost
        port: 6380
  cloud:
    gateway:
      server:
        webflux:
          observability:
            enabled: true
          routes:
            - id: edge_service
              uri: http://localhost:8181
              predicates:
                - Path=/api/user/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: edgeCircuitBreaker
                    fallbackUri: forward:/fallback/identity
            - id: auth_service
              uri: http://localhost:8182
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/identity
            - id: product_service
              uri: http://localhost:8183
              predicates:
                - Path=/api/product/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCircuitBreaker
                    fallbackUri: forward:/fallback/identity

# 로그 레벨은 기본 INFO로 두고, 트레이스가 필요한 경우에만 dev 프로파일에서 DEBUG로 올린다.
logging:
  level:
    com.example.boilerplate.gateway: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    org.springframework.web.reactive: INFO
    io.github.resilience4j: INFO
