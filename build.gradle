plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.boilerplate'
version = '0.0.1-SNAPSHOT'
description = 'Gateway Serve'

java {
    toolchain {
        // Java 21로 업그레이드. Gateway는 WebFlux/Netty 기반이라
        // Virtual Threads 직접 이득은 적지만, 전체 스택의 JDK 버전 일관성을 위해 21로 맞춘다.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive' // Redis (블랙리스트)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JJWT API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' // JJWT 구현체 (runtime에 필요)
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JJWT의 JSON 파서 (jackson 사용)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.springframework.boot:spring-boot-configuration-metadata'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    enabled = false
}

// 스프링 부트 실행 가능 jar 생성을 켭니다
bootJar {
    enabled = true
    // 아까 발생한 중복 에러 방지용 전략 추가
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}